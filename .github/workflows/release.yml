name: Create release

on:
    push:
        tags:
            - "v*"

jobs:
    build-and-release:
        runs-on: ubuntu-latest

        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v4

            - name: Set version from tag
              id: version
              run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

            - name: Create source archive
              run: |
                  git archive --format=zip -o "caelestia-shell-${{ steps.version.outputs.version }}-source.zip" HEAD
                  sha256sum "caelestia-shell-${{ steps.version.outputs.version }}-source.zip" > "caelestia-shell-${{ steps.version.outputs.version }}-source.zip.sha256"

            - name: Create release
              uses: softprops/action-gh-release@v2
              with:
                  name: "Caelestia Shell v${{ steps.version.outputs.version }}"
                  files: |
                      caelestia-shell-${{ steps.version.outputs.version }}-source.zip
                      caelestia-shell-${{ steps.version.outputs.version }}-source.zip.sha256
                  generate_release_notes: true
